<style id="rukn-page-call-css">
/* Header Call only — FAB / in-content Call stay unless the page is WhatsApp-only */
header .nav-cta .btn-call,
#hdr .nav-cta .btn-call,
header a[data-rukn-page-call],
#hdr a[data-rukn-page-call],
#ruknMob > a.btn-call{display:none!important}
header .nav-cta a.btn.btn-wa,
#ruknMob > a.btn.btn-wa{display:none!important}
/* 0586634710 / +971586634710 is WhatsApp-only — never a Call / tel: button */
a.btn-call[href*="586634710"],
a.fab-call[href*="586634710"],
a.--button-call-link-phone[href*="586634710"],
a[href="tel:+971586634710"],
a[href="tel:971586634710"],
a[href="tel:0586634710"],
a[href="tel:+971-58-663-4710"]{display:none!important}
html.rukn-wa-only a.fab-call,
html.rukn-wa-only a.btn-call,
html.rukn-wa-only a.fab-btn.fab-call,
html.rukn-wa-only a.--button-call-link-phone,
html.rukn-wa-only a[data-call="Phone"]{display:none!important}
</style>
<script>
(function(){
  var WA_ONLY="586634710";
  function digits(s){
    s=String(s||"");
    var out="";
    for(var i=0;i<s.length;i++){
      var c=s.charAt(i);
      if(c>="0"&&c<="9") out+=c;
    }
    return out;
  }
  function isWaOnly(s){
    return digits(s).indexOf(WA_ONLY)!==-1;
  }
  function pageUsesMainWa(){
    var cs=window.RuknCS;
    if(cs && isWaOnly(cs.wa_number)) return true;
    if(cs && isWaOnly(cs.call_number)) return true;
    return false;
  }
  function hideNode(a){
    if(!a) return;
    a.style.setProperty("display","none","important");
    a.setAttribute("hidden","hidden");
    a.setAttribute("aria-hidden","true");
    if((a.getAttribute("href")||"").indexOf("tel:")===0) a.removeAttribute("href");
  }
  function hideCallButtons(all){
    var cs=window.RuknCS;
    if(cs && (isWaOnly(cs.call_number) || pageUsesMainWa())){
      cs.call_number="";
      cs.call_show=false;
    }
    if(pageUsesMainWa()){
      document.documentElement.classList.add("rukn-wa-only");
      window.kayanShowCallButtons=false;
      window.kayanShowFloatingCallButton=false;
    } else {
      window.kayanShowCallButtons=true;
      window.kayanShowFloatingCallButton=true;
    }
    var sel=all
      ? "a.fab-call,a.btn-call,a.fab-btn.fab-call,a.--button-call-link-phone,a[data-call='Phone']"
      : "a[href^='tel:'],a.btn-call,a.fab-call,a.fab-btn.fab-call,a.--button-call-link-phone";
    var nodes=document.querySelectorAll(sel);
    for(var i=0;i<nodes.length;i++){
      var a=nodes[i];
      var href=a.getAttribute("href")||"";
      if(all || isWaOnly(href)) hideNode(a);
    }
    var header=document.querySelectorAll("header .nav-cta .btn-call,#hdr .nav-cta .btn-call,header a[data-rukn-page-call],#hdr a[data-rukn-page-call],#ruknMob > a.btn-call");
    for(var j=0;j<header.length;j++) hideNode(header[j]);
  }
  function run(){
    hideCallButtons(pageUsesMainWa());
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",run);
  else run();
  setTimeout(run,200);
  setTimeout(run,800);
  setTimeout(run,2000);
})();
</script>
