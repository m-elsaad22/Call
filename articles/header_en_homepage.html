  function apply(str){
    if (!str) return str;

      var b = pairs[i][1];
      if (out.indexOf(a) !== -1) out = out.split(a).join(b);
    }
    return out;
  }
  function walk(node){
    if (!node) return;
    if (node.nodeType === 3) {
      var n = apply(node.nodeValue);
      if (n !== node.nodeValue) node.nodeValue = n;
      return;
    }
    var tag = node.nodeName;
    if (tag === "SCRIPT" || tag === "STYLE") return;
    if (node.getAttribute) {
      ["aria-label","title","placeholder","alt"].forEach(function(attr){
        var v = node.getAttribute(attr);
        if (!v) return;
        var n = apply(v);
        if (n !== v) node.setAttribute(attr, n);
      });
    }
    var kids = node.childNodes;
    for (var i = 0; i < kids.length; i++) walk(kids[i]);
  }
  function chromeRoots(){
    var out = [];
    var nodes = document.querySelectorAll("header,footer,#ruknMob,ol.BreadcrumbsFilters,.YC-single-title");
    for (var i = 0; i < nodes.length; i++) out.push(nodes[i]);
    return out;
  }

    if (document.body && !document.body.classList.contains("rukn-en")) document.body.classList.add("rukn-en");
    document.title = apply(document.title);
    if (isHome) {
      if (document.body) walk(document.body);
      return;
    }
    var roots = chromeRoots();
    for (var i = 0; i < roots.length; i++) {
      try { walk(roots[i]); } catch (e) {}
    }
  }
